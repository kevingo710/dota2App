name: Claude review

# Runs the same `reviewer` subagent used by /ship (.claude/agents/reviewer.md)
# on every pull request, so agent-made PRs get the same scrutiny as local runs.
# Requires the ANTHROPIC_API_KEY repository secret; skipped on forks.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} with the
            `reviewer` subagent from .claude/agents/reviewer.md. There is no
            plan.json here: use the PR title and description as the plan.
            Diff against origin/${{ github.base_ref }}.
            Post one review comment with the verdict, the blocking issues
            (file:line, issue, fix) and the notes. Do not push commits.
          claude_args: "--max-turns 20"
