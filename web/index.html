<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dota 2 App</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;

    <div id="root"></div>
  </body>
